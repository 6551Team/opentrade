# ──────────────────────────────────────────────────────────────
# Continuous integration pipeline
# Trigger: push to any branch / pull requests
# Checks: formatting + Clippy static analysis + unit tests (cli),
#         skill script tests (tests/, Python)
# Cross-platform: Ubuntu / macOS / Windows
# ──────────────────────────────────────────────────────────────
name: CI

on:
  push:
    branches: ["*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_DIR: cli

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.CARGO_DIR }}

      - name: Check formatting
        working-directory: ${{ env.CARGO_DIR }}
        run: cargo fmt --check

      - name: Clippy lint
        working-directory: ${{ env.CARGO_DIR }}
        run: cargo clippy --locked -- -D warnings

      - name: Run tests
        working-directory: ${{ env.CARGO_DIR }}
        run: cargo test --locked

  skills:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install the optional dependency of the skill scripts
        run: python -m pip install cryptography

      - name: Skill script tests
        run: python -m unittest discover -s tests -v
